name: Continuous Integration

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/workflows/mutation-testing.yml'

  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    name: Validate and Analyze
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 25
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test with coverage
        run: npm run test:coverage

      - name: Verify coverage report
        run: |
          test -f coverage/lcov.info
          ls -lah coverage
          head -20 coverage/lcov.info

      - name: Smoke single-module
        run: npm run smoke

      - name: Maven smoke single-module
        run: npm run smoke:maven
        env:
          CODEGEN_REQUIRE_MAVEN_SMOKE: 'true'

      - name: Smoke Java multi-module
        run: npm run smoke:java-multimodule

      - name: Maven smoke Java multi-module
        run: npm run smoke:maven:java-multimodule
        env:
          CODEGEN_REQUIRE_MAVEN_SMOKE: 'true'

      - name: ArchUnit smoke Java multi-module
        run: npm run smoke:archunit:java-multimodule
        env:
          CODEGEN_REQUIRE_MAVEN_SMOKE: 'true'

      - name: Spring context smoke Java multi-module
        run: npm run smoke:spring-context:java-multimodule
        env:
          CODEGEN_REQUIRE_MAVEN_SMOKE: 'true'

      - name: HTTP runtime smoke Java multi-module
        run: npm run smoke:http:java-multimodule
        env:
          CODEGEN_REQUIRE_MAVEN_SMOKE: 'true'

      - name: HTTP persistence read smoke Java multi-module
        run: npm run smoke:http-persistence-read:java-multimodule
        env:
          CODEGEN_REQUIRE_MAVEN_SMOKE: 'true'

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Environment teardown
        if: always()
        run: echo "Finished!"
