name: Java Multimodule Maven Smoke

on:
  push:
    branches:
      - main
    paths:
      - 'packages/**'
      - 'profiles/java-spring-clean-multimodule/**'
      - 'template-packs/java-spring-clean-multimodule/**'
      - 'tests/**'
      - 'examples/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/multimodule-maven-smoke.yml'

  pull_request:
    branches:
      - main
    paths:
      - 'packages/**'
      - 'profiles/java-spring-clean-multimodule/**'
      - 'template-packs/java-spring-clean-multimodule/**'
      - 'tests/**'
      - 'examples/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'

  workflow_dispatch:

concurrency:
  group: multimodule-maven-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  maven-smoke:
    name: Maven compile generated multi-module project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Install dependencies
        run: npm ci

      - name: Run multi-module Maven smoke
        run: npm run smoke:maven:java-multimodule
        env:
          CODEGEN_REQUIRE_MAVEN_SMOKE: 'true'