id: nestjs-clean-architecture
version: 0.1.0

technology:
  language: typescript
  languageVersion: "5.9"
  framework: nestjs

architecture:
  style: clean-architecture

templatePack:
  id: nestjs-clean-architecture
  version: 0.1.0

modules:
  - id: build
    requires: []
  - id: core
    requires: []
  - id: infra-persistence
    requires:
      - core
  - id: web-api
    requires:
      - core
  - id: bootstrap
    requires:
      - core
      - infra-persistence
      - web-api

# Technology options in the ADR-017 sense: implementation choices inside a
# capability. The default keeps `npm test` and the generated-project smoke
# runnable with no database and no container runtime, which is why flipping it
# is its own decision rather than a consequence of adding the ORM.
options:
  - id: persistence
    values:
      - memory
      - typeorm
    default: memory
