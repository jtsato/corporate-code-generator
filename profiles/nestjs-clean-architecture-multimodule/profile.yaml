id: nestjs-clean-architecture-multimodule
version: 0.1.0

technology:
  language: typescript
  languageVersion: "5.9"
  framework: nestjs

architecture:
  style: clean-architecture

templatePack:
  id: nestjs-clean-architecture-multimodule
  version: 0.1.0

# The same modules as the single-package profile, and deliberately so: this is a
# layout variant, not a different capability set. Each module becomes an npm
# workspace package rather than a folder.
modules:
  - id: build
    requires: []
  - id: core
    requires: []
  - id: infra-persistence
    requires:
      - core
  - id: web-api
    requires:
      - core
  - id: bootstrap
    requires:
      - core
      - infra-persistence
      - web-api

options:
  - id: persistence
    values:
      - memory
      - typeorm
    default: memory
