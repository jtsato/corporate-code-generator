id: java-spring-clean-multimodule
version: 0.1.0

templates:
  - id: parent-pom
    module: build
    template: build/parent-pom.xml.njk
    output: pom.xml
  - id: core-pom
    module: build
    template: build/core-pom.xml.njk
    output: core/pom.xml
  - id: entrypoints-rest-pom
    module: build
    template: build/entrypoints-rest-pom.xml.njk
    output: entrypoints/rest/pom.xml
  - id: infra-database-pom
    module: build
    template: build/infra-database-pom.xml.njk
    output: infra/database/pom.xml
  - id: configuration-pom
    module: build
    template: build/configuration-pom.xml.njk
    output: configuration/pom.xml
  - id: core-domain-entity
    module: core
    template: core/domain/entity.java.njk
    output: core/src/main/java/{{ packagePath }}/core/domains/{{ domainName }}/model/{{ className }}.java
  - id: core-gateway
    module: core
    template: core/gateway/gateway.java.njk
    output: core/src/main/java/{{ packagePath }}/core/domains/{{ domainName }}/gateway/{{ className }}.java
  - id: core-find-usecase
    module: core
    template: core/usecase/find/usecase.java.njk
    output: core/src/main/java/{{ packagePath }}/core/domains/{{ domainName }}/usecase/find/{{ className }}.java
  - id: core-find-usecase-interactor
    module: core
    template: core/usecase/find/interactor.java.njk
    output: core/src/main/java/{{ packagePath }}/core/domains/{{ domainName }}/usecase/find/{{ className }}.java
  - id: core-application-exception
    module: core
    template: core/common/application-exception.java.njk
    output: core/src/main/java/{{ packagePath }}/core/common/exception/{{ className }}.java
  - id: core-field-violation
    module: core
    template: core/common/field-violation.java.njk
    output: core/src/main/java/{{ packagePath }}/core/common/exception/{{ className }}.java
  - id: core-validation-exception
    module: core
    template: core/common/validation-exception.java.njk
    output: core/src/main/java/{{ packagePath }}/core/common/exception/{{ className }}.java
  - id: core-not-found-exception
    module: core
    template: core/common/simple-exception.java.njk
    output: core/src/main/java/{{ packagePath }}/core/common/exception/{{ className }}.java
  - id: core-self-validating
    module: core
    template: core/common/self-validating.java.njk
    output: core/src/main/java/{{ packagePath }}/core/common/validation/{{ className }}.java
  - id: core-domain-validation-test
    module: core
    template: core/domain/validation-test.java.njk
    output: core/src/test/java/{{ packagePath }}/core/domains/{{ domainName }}/model/{{ className }}.java
  - id: entrypoints-rest-controller
    module: entrypoints-rest
    template: entrypoints-rest/domain/controller.java.njk
    output: entrypoints/rest/src/main/java/{{ packagePath }}/entrypoint/rest/domains/{{ domainName }}/{{ className }}.java
  - id: entrypoints-rest-response
    module: entrypoints-rest
    template: entrypoints-rest/domain/response.java.njk
    output: entrypoints/rest/src/main/java/{{ packagePath }}/entrypoint/rest/domains/{{ domainName }}/{{ className }}.java
  - id: entrypoints-rest-response-status
    module: entrypoints-rest
    template: entrypoints-rest/common/response-status.java.njk
    output: entrypoints/rest/src/main/java/{{ packagePath }}/entrypoint/rest/common/{{ className }}.java
  - id: infra-database-gateway-provider
    module: infra-database
    template: infra-database/gateway-provider.java.njk
    output: infra/database/src/main/java/{{ packagePath }}/infra/domains/{{ domainName }}/{{ className }}.java
  - id: infra-database-persistence-entity
    module: infra-database
    template: infra-database/persistence-entity.java.njk
    output: infra/database/src/main/java/{{ packagePath }}/infra/domains/{{ domainName }}/entity/{{ className }}.java
  - id: infra-database-persistence-mapper
    module: infra-database
    template: infra-database/persistence-mapper.java.njk
    output: infra/database/src/main/java/{{ packagePath }}/infra/domains/{{ domainName }}/mapper/{{ className }}.java
  - id: infra-database-repository
    module: infra-database
    template: infra-database/repository.java.njk
    output: infra/database/src/main/java/{{ packagePath }}/infra/domains/{{ domainName }}/repository/{{ className }}.java
  - id: configuration-application
    module: configuration
    template: configuration/application.java.njk
    output: configuration/src/main/java/{{ packagePath }}/{{ className }}.java
  - id: configuration-domain-wiring
    module: configuration
    template: configuration/domain-configuration.java.njk
    output: configuration/src/main/java/{{ packagePath }}/configuration/domains/{{ domainName }}/{{ className }}.java
  - id: configuration-global-exception-handler
    module: configuration
    template: configuration/global-exception-handler.java.njk
    output: configuration/src/main/java/{{ packagePath }}/configuration/exception/{{ className }}.java
  - id: configuration-cors-properties
    module: configuration
    template: configuration/cors-properties.java.njk
    output: configuration/src/main/java/{{ packagePath }}/configuration/web/{{ className }}.java
  - id: configuration-cors-web-configuration
    module: configuration
    template: configuration/cors-web-configuration.java.njk
    output: configuration/src/main/java/{{ packagePath }}/configuration/web/{{ className }}.java
  - id: configuration-openapi-configuration
    module: configuration
    template: configuration/openapi-configuration.java.njk
    output: configuration/src/main/java/{{ packagePath }}/configuration/openapi/{{ className }}.java
  - id: configuration-application-yaml
    module: configuration
    template: configuration/application.yaml.njk
    output: configuration/src/main/resources/application.yaml
  - id: configuration-application-local-yaml
    module: configuration
    template: configuration/application-local.yaml.njk
    output: configuration/src/main/resources/application-local.yaml
  - id: configuration-application-test-yaml
    module: configuration
    template: configuration/application-test.yaml.njk
    output: configuration/src/main/resources/application-test.yaml
  - id: configuration-application-prod-yaml
    module: configuration
    template: configuration/application-prod.yaml.njk
    output: configuration/src/main/resources/application-prod.yaml
  - id: configuration-messages
    module: configuration
    template: configuration/messages.properties.njk
    output: configuration/src/main/resources/messages.properties
  - id: configuration-messages-pt-br
    module: configuration
    template: configuration/messages.properties.njk
    output: configuration/src/main/resources/messages_pt_BR.properties
  - id: configuration-application-test
    module: configuration
    template: configuration/application-test.java.njk
    output: configuration/src/test/java/{{ packagePath }}/{{ className }}.java
  - id: configuration-architecture-test
    module: configuration
    template: configuration/architecture-test.java.njk
    output: configuration/src/test/java/{{ packagePath }}/architecture/{{ className }}.java
  - id: configuration-global-exception-handler-test
    module: configuration
    template: configuration/global-exception-handler-test.java.njk
    output: configuration/src/test/java/{{ packagePath }}/configuration/exception/{{ className }}.java
  - id: configuration-cors-smoke-test
    module: configuration
    template: configuration/cors-smoke-test.java.njk
    output: configuration/src/test/java/{{ packagePath }}/{{ className }}.java
  - id: configuration-openapi-smoke-test
    module: configuration
    template: configuration/openapi-smoke-test.java.njk
    output: configuration/src/test/java/{{ packagePath }}/{{ className }}.java
  - id: configuration-http-smoke-test
    module: configuration
    template: configuration/http-smoke-test.java.njk
    output: configuration/src/test/java/{{ packagePath }}/{{ className }}.java
  - id: configuration-http-persistence-read-test
    module: configuration
    template: configuration/http-persistence-read-test.java.njk
    output: configuration/src/test/java/{{ packagePath }}/{{ className }}.java
