id: nestjs-clean-architecture
version: 0.1.0

templates:
  - id: package-json
    module: build
    template: build/package.json.njk
    output: package.json
  - id: tsconfig-json
    module: build
    template: build/tsconfig.json.njk
    output: tsconfig.json
  - id: tsconfig-build-json
    module: build
    template: build/tsconfig.build.json.njk
    output: tsconfig.build.json
  - id: nest-cli-json
    module: build
    template: build/nest-cli.json.njk
    output: nest-cli.json
  - id: e2e-jest-config
    module: build
    template: build/e2e-jest.json.njk
    output: test/jest-e2e.json

  - id: core-exception
    module: core
    template: core/exceptions/core.exception.ts.njk
    output: src/core/exceptions/core.exception.ts
  - id: core-field-violation
    module: core
    template: core/exceptions/field-violation.ts.njk
    output: src/core/exceptions/field-violation.ts
  - id: core-not-found-exception
    module: core
    template: core/exceptions/not-found.exception.ts.njk
    output: src/core/exceptions/not-found.exception.ts
  - id: core-validation-exception
    module: core
    template: core/exceptions/validation.exception.ts.njk
    output: src/core/exceptions/validation.exception.ts
  - id: core-page-request
    module: core
    template: core/common/paging/page-request.ts.njk
    output: src/core/common/paging/page-request.ts
  - id: core-page-result
    module: core
    template: core/common/paging/page-result.ts.njk
    output: src/core/common/paging/page-result.ts
  - id: core-filter-operator
    module: core
    template: core/common/filter/filter-operator.ts.njk
    output: src/core/common/filter/filter-operator.ts
  - id: core-filter-condition
    module: core
    template: core/common/filter/filter-condition.ts.njk
    output: src/core/common/filter/filter-condition.ts
  - id: core-filter-expression
    module: core
    template: core/common/filter/filter-expression.ts.njk
    output: src/core/common/filter/filter-expression.ts
  - id: core-domain-model
    module: core
    template: core/models/model.ts.njk
    output: src/core/models/{{ fileName }}.model.ts
  - id: core-create-command
    module: core
    template: core/usecases/create/create.command.ts.njk
    output: src/core/usecases/create-{{ fileName }}/create-{{ fileName }}.command.ts
  - id: core-create-command-validator
    module: core
    template: core/usecases/create/create-command.validator.ts.njk
    output: src/core/usecases/create-{{ fileName }}/create-{{ fileName }}-command.validator.ts
  - id: core-create-gateway
    module: core
    template: core/usecases/create/create.gateway.ts.njk
    output: src/core/usecases/create-{{ fileName }}/create-{{ fileName }}.gateway.ts
  - id: core-create-usecase-interface
    module: core
    template: core/usecases/create/create-usecase.interface.ts.njk
    output: src/core/usecases/create-{{ fileName }}/create-{{ fileName }}-usecase.interface.ts
  - id: core-create-usecase
    module: core
    template: core/usecases/create/create.usecase.ts.njk
    output: src/core/usecases/create-{{ fileName }}/create-{{ fileName }}.usecase.ts
  - id: core-create-usecase-test
    module: core
    template: core/usecases/create/create.usecase.spec.ts.njk
    output: src/core/usecases/create-{{ fileName }}/create-{{ fileName }}.usecase.spec.ts
  - id: core-get-by-id-query
    module: core
    template: core/usecases/get-by-id/get-by-id.query.ts.njk
    output: src/core/usecases/get-{{ fileName }}-by-id/get-{{ fileName }}-by-id.query.ts
  - id: core-get-by-id-query-validator
    module: core
    template: core/usecases/get-by-id/get-by-id-query.validator.ts.njk
    output: src/core/usecases/get-{{ fileName }}-by-id/get-{{ fileName }}-by-id-query.validator.ts
  - id: core-get-by-id-gateway
    module: core
    template: core/usecases/get-by-id/get-by-id.gateway.ts.njk
    output: src/core/usecases/get-{{ fileName }}-by-id/get-{{ fileName }}-by-id.gateway.ts
  - id: core-get-by-id-usecase-interface
    module: core
    template: core/usecases/get-by-id/get-by-id-usecase.interface.ts.njk
    output: src/core/usecases/get-{{ fileName }}-by-id/get-{{ fileName }}-by-id-usecase.interface.ts
  - id: core-get-by-id-usecase
    module: core
    template: core/usecases/get-by-id/get-by-id.usecase.ts.njk
    output: src/core/usecases/get-{{ fileName }}-by-id/get-{{ fileName }}-by-id.usecase.ts
  - id: core-get-by-id-usecase-test
    module: core
    template: core/usecases/get-by-id/get-by-id.usecase.spec.ts.njk
    output: src/core/usecases/get-{{ fileName }}-by-id/get-{{ fileName }}-by-id.usecase.spec.ts
  - id: core-page-query
    module: core
    template: core/usecases/page/page.query.ts.njk
    output: src/core/usecases/page-{{ pluralFileName }}/page-{{ pluralFileName }}.query.ts
  - id: core-page-gateway
    module: core
    template: core/usecases/page/page.gateway.ts.njk
    output: src/core/usecases/page-{{ pluralFileName }}/page-{{ pluralFileName }}.gateway.ts
  - id: core-page-usecase-interface
    module: core
    template: core/usecases/page/page-usecase.interface.ts.njk
    output: src/core/usecases/page-{{ pluralFileName }}/page-{{ pluralFileName }}-usecase.interface.ts
  - id: core-page-usecase
    module: core
    template: core/usecases/page/page.usecase.ts.njk
    output: src/core/usecases/page-{{ pluralFileName }}/page-{{ pluralFileName }}.usecase.ts

  - id: infra-persistence-entity-model
    module: infra-persistence
    template: infra-persistence/models/entity.model.ts.njk
    output: src/infra/models/{{ fileName }}-entity.model.ts
  - id: infra-persistence-mapper
    module: infra-persistence
    template: infra-persistence/mappers/mapper.ts.njk
    output: src/infra/mappers/{{ fileName }}.mapper.ts
  - id: infra-persistence-repository
    module: infra-persistence
    template: infra-persistence/repositories/repository.ts.njk
    output: src/infra/repositories/{{ fileName }}.repository.ts
  - id: infra-persistence-create-provider
    module: infra-persistence
    template: infra-persistence/providers/create.provider.ts.njk
    output: src/infra/providers/create-{{ fileName }}.provider.ts
  - id: infra-persistence-get-by-id-provider
    module: infra-persistence
    template: infra-persistence/providers/get-by-id.provider.ts.njk
    output: src/infra/providers/get-{{ fileName }}-by-id.provider.ts
  - id: infra-persistence-page-provider
    module: infra-persistence
    template: infra-persistence/providers/page.provider.ts.njk
    output: src/infra/providers/page-{{ pluralFileName }}.provider.ts

  - id: web-api-not-found-exception-filter
    module: web-api
    template: web-api/commons/not-found.exception.filter.ts.njk
    output: src/web-api/commons/filters/not-found.exception.filter.ts
  - id: web-api-health-response
    module: web-api
    template: web-api/health/health-response.model.ts.njk
    output: src/web-api/health/health-response.model.ts
  - id: web-api-health-controller
    module: web-api
    template: web-api/health/health.controller.ts.njk
    output: src/web-api/health/health.controller.ts
  - id: web-api-i18n-messages
    module: web-api
    template: web-api/i18n/messages.ts.njk
    output: src/web-api/i18n/messages.ts
  - id: web-api-i18n-service
    module: web-api
    template: web-api/i18n/i18n.service.ts.njk
    output: src/web-api/i18n/i18n.service.ts
  - id: web-api-http-response
    module: web-api
    template: web-api/commons/models/http-response.model.ts.njk
    output: src/web-api/commons/models/http-response.model.ts
  - id: web-api-http-response-builder
    module: web-api
    template: web-api/commons/models/http-response.builder.ts.njk
    output: src/web-api/commons/models/http-response.builder.ts
  - id: web-api-response-transformer-interceptor
    module: web-api
    template: web-api/commons/interceptors/response-transformer.interceptor.ts.njk
    output: src/web-api/commons/interceptors/response-transformer.interceptor.ts
  - id: web-api-validation-exception-filter
    module: web-api
    template: web-api/commons/validation.exception.filter.ts.njk
    output: src/web-api/commons/filters/validation.exception.filter.ts
  - id: web-api-create-request
    module: web-api
    template: web-api/entrypoints/create-request.model.ts.njk
    output: src/web-api/entrypoints/{{ pluralFileName }}/create-{{ fileName }}-request.model.ts
  - id: web-api-response
    module: web-api
    template: web-api/entrypoints/response.model.ts.njk
    output: src/web-api/entrypoints/{{ pluralFileName }}/{{ fileName }}-response.model.ts
  - id: web-api-presenter
    module: web-api
    template: web-api/entrypoints/presenter.mapper.ts.njk
    output: src/web-api/entrypoints/{{ pluralFileName }}/{{ fileName }}-presenter.mapper.ts
  - id: web-api-page-request
    module: web-api
    template: web-api/entrypoints/page-request.model.ts.njk
    output: src/web-api/entrypoints/{{ pluralFileName }}/{{ fileName }}-page-request.model.ts
  - id: web-api-filter-parser
    module: web-api
    template: web-api/entrypoints/filter.parser.ts.njk
    output: src/web-api/entrypoints/{{ pluralFileName }}/{{ fileName }}-filter.parser.ts
  - id: web-api-page-response
    module: web-api
    template: web-api/entrypoints/page-response.model.ts.njk
    output: src/web-api/entrypoints/{{ pluralFileName }}/{{ fileName }}-page-response.model.ts
  - id: web-api-controller
    module: web-api
    template: web-api/entrypoints/controller.ts.njk
    output: src/web-api/entrypoints/{{ pluralFileName }}/{{ fileName }}.controller.ts

  - id: bootstrap-main
    module: bootstrap
    template: bootstrap/main.ts.njk
    output: src/main.ts
  - id: bootstrap-app-module
    module: bootstrap
    template: bootstrap/app.module.ts.njk
    output: src/app.module.ts
  - id: bootstrap-e2e-test
    module: bootstrap
    template: bootstrap/e2e-test.ts.njk
    output: test/app.e2e-spec.ts
  - id: bootstrap-entity-module
    module: bootstrap
    template: bootstrap/modules/module.ts.njk
    output: src/modules/{{ fileName }}.module.ts
