id: java-spring-clean
version: 0.1.0

templates:
  - id: domain-entity
    module: domain
    template: domain/entity.java.njk
    output: src/main/java/{{ packagePath }}/domain/{{ className }}.java
  - id: application-service
    module: application
    template: application/service.java.njk
    output: src/main/java/{{ packagePath }}/application/{{ className }}.java
