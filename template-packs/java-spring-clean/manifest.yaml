id: java-spring-clean
version: 0.1.0

templates:
  - id: maven-pom
    module: build
    template: build/pom.xml.njk
    output: pom.xml
  - id: domain-entity
    module: domain
    template: domain/entity.java.njk
    output: src/main/java/{{ packagePath }}/domain/{{ className }}.java
  - id: application-service
    module: application
    template: application/service.java.njk
    output: src/main/java/{{ packagePath }}/application/{{ className }}.java
  - id: spring-boot-application
    module: bootstrap
    template: bootstrap/application.java.njk
    output: src/main/java/{{ packagePath }}/{{ className }}.java
